name: cm-explore (temporaire)
on:
  push:
    branches: [cm-explore]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Télécharger le catalogue public Cardmarket
        run: |
          mkdir -p cmdata
          for f in productList/products_singles_6.json productList/products_nonsingles_6.json priceGuide/price_guide_6.json; do
            curl -fsSL "https://downloads.s3.cardmarket.com/productCatalog/$f" | gzip -9 > "cmdata/$(basename $f).gz" || echo "fail $f"
          done
          ls -la cmdata
          if git log -1 --format=%s | grep -q "^data:"; then exit 0; fi
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmdata && git commit -q -m "data: Cardmarket catalogue snapshot (temporary)" && git push -q
