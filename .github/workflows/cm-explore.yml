name: data-explore (temporaire)
on:
  push:
    branches: [cm-explore]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Télécharger pokemontcg.io
        run: |
          if git log -1 --format=%s | grep -q "^data:"; then exit 0; fi
          node scripts/pokemontcg.js download
          ls -la pokemontcg
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pokemontcg && git commit -q -m "data: pokemontcg.io snapshot (temporary)" && git push -q
